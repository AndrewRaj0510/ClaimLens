# Local stack. The frontend (:3000) and the gateway (:8000) are published to the
# host (Postgres and Redis are bound to 127.0.0.1 for local scripts and tests);
# everything else is reachable only on the compose network by service name,
# like it will be in Kubernetes.
#
#   cp .env.example .env   # then fill in the passwords and keys
#   docker compose up --build
#   python scripts/create_users.py --adjuster sam --demo-customers 3
#   open http://localhost:3000
#
# Put the trained model at data/models/best.onnx (git-ignored), or point
# MODELS_DIR at another folder. Without it, the stack still starts and
# /detect returns 503.

x-s3-env: &s3-env
  # Upload limit, read by the gateway, the vision worker and the agent alike.
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
  S3_ENDPOINT: http://seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
  S3_BUCKET: ${S3_BUCKET:-claimlens}

services:
  # Next.js: customer pages and the adjuster dashboard. The browser only talks
  # to this origin; /api/* is proxied to the gateway, so the session cookie is
  # first-party and there's no CORS to configure.
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GATEWAY_URL: http://gateway:8000
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Login and roles, then: uploads go to object storage and a job onto the Redis stream; vision
  # workers pick jobs up. /detect waits for the result (202 + job ID if slow).
  gateway:
    build: ./services/gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      <<: *s3-env
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AGENT_URL: http://agent:8000
      # Each service has its own database role (db/roles.sql): the gateway can
      # read logins, policies and vehicles, nothing else.
      DATABASE_URL: postgresql://claimlens_gateway:${DB_PASSWORD_GATEWAY:?set DB_PASSWORD_GATEWAY in .env}@postgres:5432/claimlens
      # Locally the site is plain HTTP, where browsers drop Secure cookies.
      # Behind TLS (the Ingress, Phase 6) this must be true, the default.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  # LangGraph claim workflow. Internal only: reached through the gateway.
  agent:
    build: ./services/agent
    restart: unless-stopped
    environment:
      <<: *s3-env
      DATABASE_URL: postgresql://claimlens_agent:${DB_PASSWORD_AGENT:?set DB_PASSWORD_AGENT in .env}@postgres:5432/claimlens
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      GUARDRAILS_URL: http://guardrails:8000
      OLLAMA_HOST: ${OLLAMA_HOST:-https://ollama.com}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:120b}
      # Without a key the agent still works: every LLM step falls back (see graph.py).
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      # Vision model for photo_review; it only ever gets redacted photos.
      VLM_MODEL: ${VLM_MODEL:-qwen3-vl:235b-instruct}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      policy:
        condition: service_healthy
      pricing:
        condition: service_healthy
      claims-history:
        condition: service_healthy
      guardrails:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # Checks untrusted input before it reaches an LLM: injection scan of text and
  # of text in photos (OCR), face/text redaction, image forensics. Internal
  # only; the agent calls it. Models are mounted like vision's weights
  # (python scripts/download_models.py); without them it runs rules-only and
  # says so in /health.
  guardrails:
    build: ./services/guardrails
    restart: unless-stopped
    volumes:
      - ${MODELS_DIR:-./data/models}:/models:ro
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  # Queue consumer. Scale with: docker compose up --scale vision-worker=3
  # (the HTTP API in services/vision/main.py is still in the image for direct use).
  vision-worker:
    build: ./services/vision
    restart: unless-stopped
    command: ["python", "worker.py"]
    volumes:
      - ${MODELS_DIR:-./data/models}:/models:ro
    environment:
      <<: *s3-env
      MODEL_PATH: /models/best.onnx
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      # The worker touches this file every loop; stale means it's stuck.
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-heartbeat') > 30)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # Job queue (Redis Streams). AOF persistence so queued jobs survive a restart.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for photos (MinIO's community edition is
  # archived, see docs/decisions.md). The credentials are required: without
  # them SeaweedFS's S3 gateway allows anonymous access.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - seaweeddata:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Postgres + pgvector: synthetic insurance data and policy-wording embeddings.
  # db/schema.sql runs on first start (empty volume). Published on 127.0.0.1 only,
  # so local scripts can load data; nothing outside this machine can reach it.
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: claimlens
      POSTGRES_USER: claimlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      # Per-service role passwords, set by db/role-passwords.sh on a fresh volume.
      DB_PASSWORD_GATEWAY: ${DB_PASSWORD_GATEWAY:?set DB_PASSWORD_GATEWAY in .env}
      DB_PASSWORD_AGENT: ${DB_PASSWORD_AGENT:?set DB_PASSWORD_AGENT in .env}
      DB_PASSWORD_POLICY: ${DB_PASSWORD_POLICY:?set DB_PASSWORD_POLICY in .env}
      DB_PASSWORD_PRICING: ${DB_PASSWORD_PRICING:?set DB_PASSWORD_PRICING in .env}
      DB_PASSWORD_CLAIMS_HISTORY: ${DB_PASSWORD_CLAIMS_HISTORY:?set DB_PASSWORD_CLAIMS_HISTORY in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      # Per-service roles. On a volume created before these existed, run
      # python scripts/apply_db_roles.py instead.
      - ./db/roles.sql:/docker-entrypoint-initdb.d/002_roles.sql:ro
      - ./db/role-passwords.sh:/docker-entrypoint-initdb.d/003_role_passwords.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "claimlens", "-d", "claimlens"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MCP tool servers the agent calls (streamable HTTP at http://<name>:8000/mcp).
  # Internal only. MCP_ALLOWED_HOSTS is the DNS-rebinding allowlist: requests
  # whose Host header isn't the service's own name are refused.
  policy:
    build: ./mcp_servers/policy
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://claimlens_policy:${DB_PASSWORD_POLICY:?set DB_PASSWORD_POLICY in .env}@postgres:5432/claimlens
      MCP_ALLOWED_HOSTS: policy:*,localhost:*
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: &mcp-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  pricing:
    build: ./mcp_servers/pricing
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://claimlens_pricing:${DB_PASSWORD_PRICING:?set DB_PASSWORD_PRICING in .env}@postgres:5432/claimlens
      MCP_ALLOWED_HOSTS: pricing:*,localhost:*
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *mcp-health

  # Hyphen, not underscore: underscores aren't valid in DNS names, and
  # Kubernetes service names reject them.
  claims-history:
    build: ./mcp_servers/claims_history
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://claimlens_claims_history:${DB_PASSWORD_CLAIMS_HISTORY:?set DB_PASSWORD_CLAIMS_HISTORY in .env}@postgres:5432/claimlens
      MCP_ALLOWED_HOSTS: claims-history:*,localhost:*
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *mcp-health

volumes:
  pgdata:
  redisdata:
  seaweeddata:
